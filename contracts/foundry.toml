[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Our contracts pin 0.8.28; the vendored SotechyTokens keeps its own 0.8.24
# X Layer runs the OP Stack; cancun is a safe target there
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The receipt picture is one long string; the IR pipeline compiles it without stack limits
via_ir = true
# Tests and scripts read the circuits' bytes from ../circuits/netlists.json
fs_permissions = [{ access = "read", path = "../circuits/netlists.json" }, { access = "read", path = "./out" }, { access = "read", path = "../checker/index.html" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"

[fmt]
line_length = 120

[lint]
# The vendored SotechyTokens stays exactly as it is in Sotechy-App
ignore = ["src/vendor/SotechyTokens.sol"]
# `1 << i` builds the circuits' input bits; the order is intended
exclude_lints = ["incorrect-shift"]
