[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Our contracts pin 0.8.28; the vendored SotechyTokens keeps its own 0.8.24
# X Layer runs the OP Stack; cancun is a safe target there
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Tests and scripts read the circuits' bytes from ../circuits/netlists.json
fs_permissions = [{ access = "read", path = "../circuits/netlists.json" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"

[fmt]
line_length = 120
